# General SSH client performance and behavior settings
Host *
    # Connection multiplexing for faster subsequent connections
    ControlMaster auto
    ControlPath ~/.ssh/control/%C
    ControlPersist 600

    # Keep connections alive
    ServerAliveInterval 60
    ServerAliveCountMax 3

    # Compression for slow connections
    Compression yes

    # Add keys to agent automatically
    AddKeysToAgent yes

    # Use visual host key for verification
    VisualHostKey yes
