# GitHub-specific SSH optimizations
Host github.com
    Hostname github.com
    User git

    # Keep GitHub connections alive longer
    ControlPersist 120

    # GitHub's verified host keys (ED25519, ECDSA, RSA)
    # These will be added to known_hosts on first connection
    # ED25519: SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU
    # ECDSA: SHA256:p2QAMXNIC1TJYWeIOttrVc98/R1BUFWu3/LiyKgUfQM
    # RSA: SHA256:uNiVztksCsDhcc0u9e8BujQXVUpKZIDTMczCvj3tD2s

# GitLab-specific SSH optimizations
Host gitlab.com
    Hostname gitlab.com
    User git
    ControlPersist 120
